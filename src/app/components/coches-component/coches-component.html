<h1>Coches</h1>
<br>
<div class="grid col5 gap1">
    @for (coche of coches; track $index) {
        <div class="btnM">
            <img src="{{coche.imagen}}" alt="">
            <h2>{{coche.marca}}</h2>
            <p>{{coche.modelo}}</p>
            <p>{{coche.conductor}}</p>
        </div>
    }
</div>
